name: Deploy ERP

on:
  push:
    branches:
      - version-16

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 600s
          script: |
            set -e
            SITE="api.erp.udvell.rolaface.com"
            BENCH_DIR="/srv/apps/erp/backend/rolaface-izayne-bench"

            su - frappe -c "SITE='$SITE' BENCH_DIR='$BENCH_DIR' bash -s" <<'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 24
            set -eo pipefail

            export PATH="$HOME/.local/bin:$PATH"
            cd "$BENCH_DIR"
            source env/bin/activate

            echo "⬇️ Pull latest code..."
            cd apps/custom_hrms
            git pull upstream version-16
            cd "$BENCH_DIR"

            echo "⚙️ Run migrations..."
            bench --site "$SITE" migrate

            echo "🎨 Build assets..."
            bench build --verbose 2>&1 | { grep -v 'Browserslist: caniuse-lite is outdated' || true; }

            echo "🧹 Clear cache..."
            bench --site "$SITE" clear-cache
            EOF

            echo "🔄 Restarting services..."
            supervisorctl restart rolaface-izayne-bench-web:rolaface-izayne-bench-frappe-web || true
            supervisorctl restart rolaface-izayne-bench-workers:rolaface-izayne-bench-frappe-short-worker-0 rolaface-izayne-bench-workers:rolaface-izayne-bench-frappe-long-worker-0 || true
            supervisorctl status | grep rolaface-izayne-bench || true

            echo "✅ Deploy complete!"
